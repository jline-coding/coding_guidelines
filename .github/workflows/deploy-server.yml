name: Deploy To Server

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy = release new version | rollback = restore previous release'
        type: choice
        options: [deploy, rollback]
        default: deploy
      force:
        description: 'Bypass file count drop safety check (use only when intentional)'
        type: boolean
        default: false

permissions:
  contents: read

# Never run concurrent deploys; subsequent runs queue behind active one
concurrency:
  group: deploy-server-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Uses GitHub "production" environment for approval gates / protection rules
    environment: production
    steps:
      - name: 🛡️ Restrict to master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Deploy is only allowed from master branch (current: ${GITHUB_REF})"
          exit 1

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📑 Read deploy-config.json
        id: cfg
        run: |
          METHOD=$(jq -r '.production.deploy_method // "none"' deploy-config.json)
          SERVER=$(jq -r '.production.server // ""' deploy-config.json | tr 'a-z' 'A-Z')
          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "Deploy method: $METHOD | Server secret: ${SERVER}_CONFIG"
          if [ "$METHOD" = "ssh" ] && ! [[ "$SERVER" =~ ^[A-Z0-9_]+$ ]]; then
            echo "::error::Invalid production.server"; exit 1
          fi

      - name: ⚙️ Setup Node
        if: steps.cfg.outputs.method == 'ssh' && inputs.mode != 'rollback'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        if: steps.cfg.outputs.method == 'ssh' && inputs.mode != 'rollback'
        run: npm ci

      - name: 🔨 Build VitePress (failsafe: server untouched on build error)
        if: steps.cfg.outputs.method == 'ssh' && inputs.mode != 'rollback'
        run: npm run docs:build

      - name: 🚀 Safe Deploy (staging → swap → health check)
        if: steps.cfg.outputs.method == 'ssh'
        run: bash .github/scripts/deploy-ssh.sh
        env:
          GITHUB_REPO: ${{ github.repository }}
          DEPLOY_MODE: ${{ inputs.mode || 'deploy' }}
          DEPLOY_FORCE: ${{ inputs.force || 'false' }}
          SERVER_CONFIG: ${{ secrets[format('{0}_CONFIG', steps.cfg.outputs.server)] || secrets[steps.cfg.outputs.server] || secrets.JLWEB_CONFIG }}

      - name: ℹ️ Server deploy disabled
        if: steps.cfg.outputs.method != 'ssh'
        run: echo "deploy-config.json → production.deploy_method is not 'ssh' → skipping."
